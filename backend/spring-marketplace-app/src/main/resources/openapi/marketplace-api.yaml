openapi: 3.1.0
info:
  title: Marketplace Platform API
  version: 1.0.0
  description: |
    多賣家電商平台的 API，第一版範圍。
    設計慣例見《設計_005_API規格》。
servers:
  - url: http://localhost:8080
tags:
  - name: public
    description: 不需要登入
  - name: member-auth
    description: 會員認證
  - name: member
    description: 會員
  - name: seller-auth
    description: 賣家帳號認證
  - name: seller
    description: 賣家
  - name: ops-auth
    description: 營運帳號認證
  - name: ops
    description: 平台營運
  - name: webhook
    description: 模擬金流的回呼

paths:
  # ---------------------------------------------------------------- public
  /api/v1/public/rules:
    get:
      tags: [public]
      operationId: getRules
      security: []
      summary: 規則告知用的設定值
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rules" }

  /api/v1/public/categories:
    get:
      tags: [public]
      operationId: listCategories
      security: []
      summary: 分類清單
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }

  /api/v1/public/products:
    get:
      tags: [public]
      operationId: searchProducts
      security: []
      summary: 分類瀏覽與關鍵字搜尋
      description: 只回傳上架中的商品。最深只能取得第 1,000 筆結果。
      parameters:
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
        - name: minPrice
          in: query
          schema: { $ref: "#/components/schemas/Amount" }
        - name: maxPrice
          in: query
          schema: { $ref: "#/components/schemas/Amount" }
        - name: sort
          in: query
          schema:
            type: string
            enum: [NEWEST, PRICE_ASC, PRICE_DESC]
            default: NEWEST
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductSummaryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/public/products/{productId}:
    get:
      tags: [public]
      operationId: getProduct
      security: []
      summary: 商品頁
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/public/terms/{documentType}/latest:
    get:
      tags: [public]
      operationId: getLatestTerms
      security: []
      summary: 最新版本的條款
      parameters:
        - name: documentType
          in: path
          required: true
          schema: { $ref: "#/components/schemas/TermsDocumentType" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermsDocument" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- member auth
  /api/v1/member/auth/register:
    post:
      tags: [member-auth]
      operationId: registerMember
      security: []
      summary: 會員註冊
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterMemberRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/member/auth/login:
    post:
      tags: [member-auth]
      operationId: loginMember
      security: []
      summary: 會員登入
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/TokenIssued" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/member/auth/refresh:
    post:
      tags: [member-auth]
      operationId: refreshMemberToken
      summary: 換發存取權杖
      security:
        - refreshTokenCookie: []
      responses:
        "200": { $ref: "#/components/responses/TokenIssued" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/member/auth/logout:
    post:
      tags: [member-auth]
      operationId: logoutMember
      summary: 登出
      security:
        - refreshTokenCookie: []
      responses:
        "204": { $ref: "#/components/responses/LoggedOut" }

  /api/v1/member/auth/password:
    post:
      tags: [member-auth]
      operationId: changeMemberPassword
      summary: 修改密碼
      description: 成功後撤銷該帳號所有更新權杖，須重新登入。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { $ref: "#/components/responses/LoggedOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- member
  /api/v1/member/terms-consents:
    post:
      tags: [member]
      operationId: consentMemberTerms
      summary: 同意新版本的條款
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TermsConsentRequest" }
      responses:
        "204":
          description: No Content
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/member/shipping-addresses:
    get:
      tags: [member]
      operationId: listShippingAddresses
      summary: 收件資訊清單
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShippingAddress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [member]
      operationId: createShippingAddress
      summary: 新增收件資訊
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShippingAddressRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShippingAddress" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/member/shipping-addresses/{addressId}:
    parameters:
      - name: addressId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [member]
      operationId: updateShippingAddress
      summary: 修改收件資訊
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShippingAddressRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShippingAddress" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [member]
      operationId: deleteShippingAddress
      summary: 刪除收件資訊
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/member/cart:
    get:
      tags: [member]
      operationId: getCart
      summary: 購物車
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/member/cart/items/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    put:
      tags: [member]
      operationId: putCartItem
      summary: 加入購物車或修改數量
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartItemRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [member]
      operationId: deleteCartItem
      summary: 從購物車移除
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/member/checkouts:
    get:
      tags: [member]
      operationId: listMemberCheckouts
      summary: 我的訂單列表
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CheckoutStatus" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSummaryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [member]
      operationId: createCheckout
      summary: 結帳
      description: 結帳購物車中指定的商品，依賣家拆成子訂單並預扣庫存。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCheckoutRequest" }
      responses:
        "200":
          description: 相同冪等鍵的重複請求，回傳第一次建立的結帳單
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkout" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/member/checkouts/{checkoutId}:
    get:
      tags: [member]
      operationId: getMemberCheckout
      summary: 訂單詳情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/member/checkouts/{checkoutId}/cancel:
    post:
      tags: [member]
      operationId: cancelCheckout
      summary: 主動取消結帳單
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/member/checkouts/{checkoutId}/payments:
    post:
      tags: [member]
      operationId: createPayment
      summary: 發起付款
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "200":
          description: 相同冪等鍵的重複請求，回傳第一次的付款
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "201":
          description: Created；狀態可能為成功、失敗或處理中
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/member/checkouts/{checkoutId}/payments/latest:
    get:
      tags: [member]
      operationId: getLatestPayment
      summary: 查詢最新一筆付款的結果
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- seller auth
  /api/v1/seller/auth/login:
    post:
      tags: [seller-auth]
      operationId: loginSellerUser
      security: []
      summary: 賣家帳號登入
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/TokenIssued" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/seller/auth/refresh:
    post:
      tags: [seller-auth]
      operationId: refreshSellerUserToken
      summary: 換發存取權杖
      security:
        - refreshTokenCookie: []
      responses:
        "200": { $ref: "#/components/responses/TokenIssued" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/seller/auth/logout:
    post:
      tags: [seller-auth]
      operationId: logoutSellerUser
      summary: 登出
      security:
        - refreshTokenCookie: []
      responses:
        "204": { $ref: "#/components/responses/LoggedOut" }

  /api/v1/seller/auth/password:
    post:
      tags: [seller-auth]
      operationId: changeSellerUserPassword
      summary: 修改密碼
      description: 成功後撤銷該帳號所有更新權杖，須重新登入。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { $ref: "#/components/responses/LoggedOut" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- seller
  /api/v1/seller/terms-consents:
    post:
      tags: [seller]
      operationId: consentSellerTerms
      summary: 同意賣家條款（管理者）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TermsConsentRequest" }
      responses:
        "204":
          description: No Content
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/seller/products:
    get:
      tags: [seller]
      operationId: listSellerProducts
      summary: 賣家的商品列表
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ProductStatus" }
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerProductPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [seller]
      operationId: createSellerProduct
      summary: 新增商品（建立時為下架狀態）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerProduct" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/seller/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [seller]
      operationId: getSellerProduct
      summary: 商品詳情
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerProduct" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [seller]
      operationId: updateSellerProduct
      summary: 修改商品
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerProduct" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/seller/products/{productId}/list:
    post:
      tags: [seller]
      operationId: listProduct
      summary: 上架
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerProduct" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/seller/products/{productId}/unlist:
    post:
      tags: [seller]
      operationId: unlistProduct
      summary: 下架
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerProduct" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/seller/products/{productId}/stock:
    get:
      tags: [seller]
      operationId: getStock
      summary: 庫存數字
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stock" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/seller/products/{productId}/stock/movements:
    get:
      tags: [seller]
      operationId: listStockMovements
      summary: 庫存異動紀錄
      description: 未指定日期區間時查詢最近 30 天，區間最長 1 年。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - name: movementType
          in: query
          schema: { $ref: "#/components/schemas/StockMovementType" }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMovementPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/seller/products/{productId}/stock/inbound:
    post:
      tags: [seller]
      operationId: inboundStock
      summary: 入庫
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockInboundRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/seller/products/{productId}/stock/adjustments:
    post:
      tags: [seller]
      operationId: adjustStock
      summary: 調整庫存
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockAdjustmentRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/seller/orders:
