  /api/v1/ops/terms-documents:
    post:
      tags: [ops]
      operationId: publishTermsDocument
      summary: 發布條款新版本（營運管理者）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishTermsRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermsDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/ops/operator-users:
    get:
      tags: [ops]
      operationId: listOperatorUsers
      summary: 營運帳號列表（營運管理者）
      security:
