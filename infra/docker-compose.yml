# Local environment (設計_003 3.1).
# The two services run from the IDE or with ./mvnw spring-boot:run for now; their containers and
# the observability tools are added in later stages.
name: marketplace-platform

services:
  postgres:
    # Same image as the tests (postgres.image in the service poms).
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
